[versions]
composeCompiler = "1.5.14"
composeBom = "2024.06.00"
coreKtx = "1.13.1"
activityCompose = "1.9.1"
lifecycle = "2.8.4"
media3 = "1.4.1"
okhttp = "4.12.0"
coil = "2.6.0"
datastore = "1.1.1"
coroutines = "1.8.1"
desugar = "2.1.5"
# Pinned on purpose: YouTube changes break old versions. To bump, change this
# value to a newer tag from https://github.com/TeamNewPipe/NewPipeExtractor/releases
newpipe = "v0.26.5"
nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
newpipe = { module = "com.github.teamnewpipe:NewPipeExtractor", version.ref = "newpipe" }
nanojson = { module = "com.github.TeamNewPipe:nanojson", version.ref = "nanojson" }
junit = { module = "junit:junit", version.ref = "junit" }

